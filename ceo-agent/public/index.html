<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Steering Committee: Live CEO</title>
<style>
  :root {
    --bg: #f4f2ee; --panel: #fff; --ink: #1c1d21; --soft: #6b6d75; --line: #dcd9d2;
    --accent: #1f3a5f; --hot: #b3261e; color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #121317; --panel: #1b1d22; --ink: #ecebe8; --soft: #9a9ca4; --line: #2c2f36; --accent: #8fb3e0; --hot: #f2867d; color-scheme: dark; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  header { padding: 20px 24px 8px; display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
  h1 { font-size: 1.25rem; margin: 0; font-weight: 650; }
  header p { margin: 0; color: var(--soft); }
  main { display: grid; grid-template-columns: 320px 1fr; gap: 16px; padding: 12px 24px 24px; }
  @media (max-width: 860px) { main { grid-template-columns: 1fr; } }
  section { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 16px; }
  h2 { font-size: .8rem; text-transform: uppercase; letter-spacing: .06em; color: var(--soft); margin: 0 0 10px; font-weight: 600; }
  label { display: grid; gap: 4px; font-size: .85rem; color: var(--soft); margin-bottom: 10px; }
  input, textarea, select { font: inherit; color: var(--ink); background: transparent; border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; }
  textarea { resize: vertical; min-height: 70px; }
  input[type=range] { padding: 0; }
  button { font: inherit; font-weight: 600; border: 0; border-radius: 999px; padding: 10px 18px; cursor: pointer; background: var(--accent); color: var(--panel); }
  button.ghost { background: transparent; color: var(--ink); border: 1px solid var(--line); }
  button:disabled { opacity: .5; cursor: default; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .status { display: inline-flex; align-items: center; gap: 8px; color: var(--soft); font-size: .9rem; }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--line); }
  .listening .dot { background: #2e9d5b; animation: pulse 1.4s infinite; }
  .thinking .dot { background: #d29a20; }
  .speaking .dot { background: var(--hot); }
  @keyframes pulse { 50% { opacity: .35; } }
  .ceo-now { margin: 14px 0 0; min-height: 3.2em; font-size: 1.35rem; line-height: 1.35; font-weight: 600; color: var(--hot); }
  .feed { height: 46vh; overflow-y: auto; border-top: 1px solid var(--line); margin-top: 12px; padding-top: 10px; }
  .msg { margin: 0 0 10px; }
  .msg b { font-size: .75rem; letter-spacing: .05em; text-transform: uppercase; color: var(--soft); display: block; }
  .msg.ceo b { color: var(--hot); }
  .msg.ceo p { font-weight: 600; }
  .msg p { margin: 0; }
  .interim { color: var(--soft); font-style: italic; }
  .log { font-size: .8rem; color: var(--soft); max-height: 22vh; overflow-y: auto; margin: 0; padding-left: 18px; }
  .log li.hit { color: var(--hot); }
  .hint { font-size: .82rem; color: var(--soft); margin: 6px 0 0; }
  .err { color: var(--hot); font-size: .9rem; }
</style>
</head>
<body>
<header>
  <h1>Strategic Steering Committee</h1>
  <p>Maggie Kessler, CEO, is listening.</p>
</header>

<main>
  <div>
    <section>
      <h2>Meeting</h2>
      <label>Company<input id="company" placeholder="e.g. Kessler Industries, $4.2B revenue"></label>
      <label>Presenter's name<input id="presenter" placeholder="e.g. Daniel"></label>
      <label>Agenda item<input id="topic" placeholder="e.g. $60M ERP replacement, phase 2 approval"></label>
      <label>Pre-read notes (optional)<textarea id="notes" placeholder="Anything the CEO already knows going in"></textarea></label>
      <label>Intensity: <span id="intLabel"></span><input id="intensity" type="range" min="1" max="5" value="3"></label>
      <label>Voice<select id="voice"></select></label>
    </section>
    <section style="margin-top:16px">
      <h2>Decision log</h2>
      <ol class="log" id="log"></ol>
    </section>
  </div>

  <section>
    <div class="row">
      <button id="start">Start listening</button>
      <button id="hush" class="ghost" disabled>Quiet, Maggie</button>
      <button id="reset" class="ghost">Clear transcript</button>
      <span class="status" id="status"><span class="dot"></span><span id="statusText">Idle</span></span>
    </div>
    <p class="hint">Use headphones, so Maggie doesn't hear herself through your speakers. Live listening needs Chrome or Edge; in other browsers, type below.</p>
    <p class="err" id="err"></p>
    <p class="ceo-now" id="ceoNow" aria-live="assertive"></p>
    <div class="feed" id="feed"></div>
    <form id="typeForm" class="row" style="margin-top:10px">
      <input id="typed" style="flex:1" placeholder="Or type what the presenter says and press Enter">
      <button type="submit" class="ghost">Say it</button>
    </form>
  </section>
</main>

<script>
const $ = id => document.getElementById(id);
const COOLDOWN_S = { 1: 45, 2: 30, 3: 18, 4: 10, 5: 6 };
const INT_NAMES = { 1: "patient", 2: "measured", 3: "direct", 4: "demanding", 5: "relentless" };
const DEBOUNCE_MS = 700;

let transcript = [];         // { speaker: "presenter" | "ceo", text }
let listening = false, speaking = false, inFlight = false, again = false;
let lastSpokeAt = 0, debounceTimer = null, interimEl = null, rec = null;
let generation = 0;          // bumps each time Maggie speaks; stale decisions are dropped

// ---- settings persistence ----
const FIELDS = ["company", "presenter", "topic", "notes", "intensity"];
for (const f of FIELDS) {
  const saved = localStorage.getItem("ceo." + f);
  if (saved != null) $(f).value = saved;
  $(f).addEventListener("input", () => { localStorage.setItem("ceo." + f, $(f).value); showIntensity(); });
}
function showIntensity() { $("intLabel").textContent = INT_NAMES[$("intensity").value]; }
showIntensity();

// ---- voices ----
function loadVoices() {
  const voices = speechSynthesis.getVoices().filter(v => v.lang.startsWith("en"));
  const saved = localStorage.getItem("ceo.voice");
  $("voice").innerHTML = voices.map(v => `<option value="${v.name}">${v.name} (${v.lang})</option>`).join("");
  if (saved && voices.some(v => v.name === saved)) $("voice").value = saved;
}
speechSynthesis.onvoiceschanged = loadVoices; loadVoices();
$("voice").addEventListener("change", () => localStorage.setItem("ceo.voice", $("voice").value));

// ---- UI helpers ----
function setStatus() {
  const s = $("status");
  s.className = "status " + (speaking ? "speaking" : inFlight ? "thinking" : listening ? "listening" : "");
  $("statusText").textContent = speaking ? "Maggie is speaking" : inFlight ? "Maggie is weighing in…" : listening ? "Listening" : "Idle";
  $("hush").disabled = !speaking;
}
function addMsg(speaker, text) {
  transcript.push({ speaker, text });
  const div = document.createElement("div");
  div.className = "msg " + speaker;
  div.innerHTML = `<b>${speaker === "ceo" ? "Maggie (CEO)" : ($("presenter").value || "Presenter")}</b><p></p>`;
  div.querySelector("p").textContent = text;
  $("feed").insertBefore(div, interimEl);
  $("feed").scrollTop = $("feed").scrollHeight;
}
function showInterim(text) {
  if (!interimEl) { interimEl = document.createElement("p"); interimEl.className = "interim msg"; $("feed").appendChild(interimEl); }
  interimEl.textContent = text;
  $("feed").scrollTop = $("feed").scrollHeight;
}
function log(text, hit) {
  const li = document.createElement("li");
  li.textContent = text; if (hit) li.className = "hit";
  $("log").prepend(li);
}

// ---- presenter speech in ----
function heard(text) {
  text = text.trim();
  if (!text || speaking) return;   // ignore our own voice leaking into the mic
  addMsg("presenter", text);
  clearTimeout(debounceTimer);
  debounceTimer = setTimeout(requestDecision, DEBOUNCE_MS);
}

// ---- decision loop ----
async function requestDecision() {
  if (inFlight) { again = true; return; }
  if (!transcript.length || transcript.at(-1).speaker !== "presenter") return;
  const intensity = Number($("intensity").value);
  const sinceS = lastSpokeAt ? (Date.now() - lastSpokeAt) / 1000 : Infinity;
  if (sinceS < COOLDOWN_S[intensity]) return;

  inFlight = true; again = false; setStatus();
  const myGen = generation;
  try {
    const r = await fetch("/api/decide", {
      method: "POST", headers: { "content-type": "application/json" },
      body: JSON.stringify({
        context: { company: $("company").value, presenter: $("presenter").value, topic: $("topic").value, notes: $("notes").value },
        transcript, intensity,
        secondsSinceLastInterruption: Number.isFinite(sinceS) ? sinceS : null,
      }),
    });
    const d = await r.json();
    if (!r.ok) throw new Error(d.error || r.statusText);
    $("err").textContent = "";
    const secs = (d.ms / 1000).toFixed(1) + "s";
    if (d.action === "interrupt" && d.line && myGen === generation && !speaking) {
      log(`${secs} · interrupt: ${d.reason}`, true);
      speak(d.line);
    } else {
      log(`${secs} · hold${d.reason ? ": " + d.reason : ""}`);
    }
  } catch (e) {
    $("err").textContent = "Couldn't reach the CEO: " + e.message;
  } finally {
    inFlight = false; setStatus();
    if (again && !speaking) requestDecision();
  }
}

// ---- CEO speech out ----
function speak(line) {
  generation++;
  speaking = true; setStatus();
  addMsg("ceo", line);
  $("ceoNow").textContent = line;
  const u = new SpeechSynthesisUtterance(line);
  const v = speechSynthesis.getVoices().find(v => v.name === $("voice").value);
  if (v) u.voice = v;
  u.rate = 1.05; u.pitch = 0.95;
  const done = () => {
    // short grace period so the tail of our own audio isn't transcribed
    setTimeout(() => { speaking = false; lastSpokeAt = Date.now(); setStatus(); }, 500);
  };
  u.onend = done; u.onerror = done;
  speechSynthesis.cancel();
  speechSynthesis.speak(u);
}
$("hush").addEventListener("click", () => speechSynthesis.cancel());
document.addEventListener("keydown", e => { if (e.key === "Escape") speechSynthesis.cancel(); });

// ---- microphone ----
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
if (!SR) {
  $("start").disabled = true;
  $("err").textContent = "This browser has no live speech recognition. Open in Chrome or Edge, or type below.";
}
function startRec() {
  rec = new SR();
  rec.continuous = true; rec.interimResults = true; rec.lang = "en-US";
  rec.onresult = ev => {
    let interim = "";
    for (let i = ev.resultIndex; i < ev.results.length; i++) {
      const r = ev.results[i];
      if (r.isFinal) { showInterim(""); heard(r[0].transcript); }
      else interim += r[0].transcript;
    }
    if (!speaking) showInterim(interim);
  };
  rec.onerror = ev => {
    if (ev.error === "not-allowed" || ev.error === "service-not-allowed") {
      $("err").textContent = "Microphone access was blocked. Allow it in the address bar and try again.";
      stopListening();
    }
  };
  rec.onend = () => { if (listening) try { rec.start(); } catch {} };  // Chrome stops periodically; keep going
  rec.start();
}
function stopListening() { listening = false; try { rec && rec.stop(); } catch {} $("start").textContent = "Start listening"; setStatus(); }
$("start").addEventListener("click", () => {
  if (listening) return stopListening();
  listening = true; $("start").textContent = "Stop listening"; $("err").textContent = "";
  startRec(); setStatus();
});

// ---- typed input ----
$("typeForm").addEventListener("submit", e => {
  e.preventDefault();
  const t = $("typed").value; $("typed").value = "";
  heard(t);
});
$("reset").addEventListener("click", () => {
  transcript = []; $("feed").innerHTML = ""; interimEl = null; $("ceoNow").textContent = ""; $("log").innerHTML = "";
  lastSpokeAt = 0; generation++;
});
setStatus();
</script>
</body>
</html>

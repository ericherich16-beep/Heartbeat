<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Diagram Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600&display=swap" rel="stylesheet">
<style>
/* VOICE work: a drafting tool for schemas and process maps, quiet chrome, the canvas is the hero
   IDEA a drafting table: dotted grid paper, a stencil of shapes on the left, a format inspector on the right
   PICTURE the live canvas itself, opening on a sample order schema with field-level relationships
   COLOUR white paper, ink #0b0b10, signal green #00a862 for selection and connections, mist #eafaf2; night #07130d
   TYPE Space Grotesk 600 for the file name + Inter for everything else
   LAYOUT laptop: toolbar / stencil | canvas | inspector / page tabs; phone: toolbar, stencil strip, canvas, inspector as a sheet */
:root{color-scheme:light dark;
--bg:light-dark(#ffffff,#07130d);--chrome:light-dark(#f6f8f7,#0c1a13);--ink:light-dark(#0b0b10,#e8f2ec);--mute:light-dark(#5b6470,#93a59b);
--line:light-dark(#dfe4e2,#1f3329);--paper:light-dark(#ffffff,#0a1711);--dot:light-dark(#cfd6d3,#1d3227);
--acc:light-dark(#00a862,#2bd48a);--accInk:light-dark(#ffffff,#04110a);--mist:light-dark(#eafaf2,#0f2a1d);--danger:light-dark(#c62828,#ff7a70)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.4 Inter,system-ui,sans-serif;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
#app{height:100%;display:grid;grid-template:"top top top" auto "pal cv insp" minmax(0,1fr) "pal tabs insp" auto/208px minmax(0,1fr) 300px}
#top{grid-area:top;display:flex;align-items:center;gap:6px;flex-wrap:wrap;padding:8px 12px;border-bottom:1px solid var(--line);background:var(--chrome)}
#fname{font:600 19px/1.1 "Space Grotesk",Inter,sans-serif;letter-spacing:-.02em;border:1px solid transparent;background:none;padding:6px 8px;border-radius:6px;width:min(260px,40vw)}
#fname:hover,#fname:focus{border-color:var(--line);background:var(--paper)}
.grp{display:flex;gap:2px;align-items:center;padding:0 6px;border-left:1px solid var(--line)}
.tb{height:36px;min-width:36px;padding:0 10px;border:1px solid transparent;border-radius:6px;background:none;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.tb:hover{background:var(--mist);border-color:var(--line)}
.tb:disabled{opacity:.4;cursor:default;background:none;border-color:transparent}
.tb svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.tb.on{background:var(--mist);border-color:var(--acc)}
#zoomv{min-width:52px;text-align:center;font-variant-numeric:tabular-nums;color:var(--mute)}
#status{margin-left:auto;color:var(--mute);font-size:13px;white-space:nowrap;padding-right:4px}
#pal{grid-area:pal;border-right:1px solid var(--line);background:var(--chrome);overflow:auto;padding:10px}
#pal h3{font-size:13px;font-weight:600;color:var(--mute);margin:12px 4px 6px}
#pal h3:first-child{margin-top:2px}
.sg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px}
.si{border:1px solid transparent;background:none;border-radius:8px;padding:6px 2px 4px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11.5px;color:var(--mute);touch-action:none;user-select:none}
.si:hover{background:var(--paper);border-color:var(--line);color:var(--ink)}
.si svg{width:46px;height:30px;overflow:visible}
.si svg *{fill:var(--paper);stroke:var(--ink);stroke-width:1.3}
.si.wide{grid-column:span 3;flex-direction:row;justify-content:flex-start;gap:10px;padding:6px 8px;font-size:13px;color:var(--ink)}
#cv{grid-area:cv;position:relative;overflow:hidden;background-color:var(--paper);background-image:radial-gradient(var(--dot) 1.1px,transparent 1.2px);touch-action:none}
#svg{position:absolute;inset:0;width:100%;height:100%;user-select:none;-webkit-user-select:none}
#svg text{font-family:Inter,system-ui,sans-serif;pointer-events:none}
.port{opacity:0;fill:var(--paper);stroke:var(--acc);stroke-width:1.5;cursor:crosshair;transition:opacity .12s}
.nd:hover .port,#svg.linking .port,.nd.sel .port{opacity:1}
.port:hover{fill:var(--acc);r:6}
.eh{fill:var(--acc);stroke:var(--paper);stroke-width:2;cursor:move}
.rh{fill:var(--paper);stroke:var(--acc);stroke-width:1.5}
.hit{stroke:transparent;fill:none;stroke-width:14;cursor:pointer;pointer-events:stroke}
#ed{position:absolute;display:none;z-index:5;border:2px solid var(--acc);border-radius:4px;background:var(--paper);resize:none;text-align:center;padding:4px;line-height:1.25;overflow:hidden}
#hint{position:absolute;left:12px;top:10px;color:var(--mute);font-size:12.5px;pointer-events:none;background:color-mix(in srgb,var(--paper) 85%,transparent);padding:2px 6px;border-radius:4px}
#tabs{grid-area:tabs;display:flex;align-items:center;gap:2px;border-top:1px solid var(--line);background:var(--chrome);padding:4px 8px;overflow-x:auto}
.tab{height:32px;padding:0 12px;border:1px solid transparent;border-radius:6px;background:none;white-space:nowrap;color:var(--mute)}
.tab.on{background:var(--paper);border-color:var(--line);color:var(--ink);font-weight:600}
#insp{grid-area:insp;border-left:1px solid var(--line);background:var(--chrome);overflow:auto;padding:14px}
#insp h2{font:600 16px/1.2 "Space Grotesk",Inter,sans-serif;margin:0 0 10px}
#insp label{display:block;font-size:12.5px;color:var(--mute);margin:12px 0 4px}
#insp .row{display:flex;gap:6px;align-items:center}
#insp input[type=text],#insp select,#insp textarea{width:100%;border:1px solid var(--line);border-radius:6px;background:var(--paper);padding:7px 8px;font-size:14px}
#insp textarea{min-height:64px;resize:vertical}
.sw{display:flex;gap:6px;flex-wrap:wrap}
.sw button{width:26px;height:26px;border-radius:50%;border:2px solid var(--paper);box-shadow:0 0 0 1px var(--line)}
.sw button.on{box-shadow:0 0 0 2px var(--acc)}
.btn{height:34px;padding:0 12px;border:1px solid var(--line);border-radius:6px;background:var(--paper);white-space:nowrap}
.btn:hover{border-color:var(--acc)}
.btn.pri{background:var(--acc);color:var(--accInk);border-color:var(--acc);font-weight:600}
.btn.del{color:var(--danger)}
.fl{display:grid;grid-template-columns:14px minmax(0,1.5fr) minmax(0,1fr) auto auto 20px;gap:4px;align-items:center;margin-bottom:4px}
.fl input[type=text]{padding:5px 6px !important;font-size:13px !important}
.fl .k{font-size:10.5px;font-weight:700;display:flex;align-items:center;gap:1px;color:var(--mute);cursor:pointer;white-space:nowrap}
.fl .x,.fl .drag{border:0;background:none;color:var(--mute);padding:0;height:26px}
.fl .drag{cursor:grab;font-size:12px}
.fl.hl input{border-color:var(--acc) !important}
.al{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px}
.al .btn{padding:0 4px;font-size:12.5px}
.note{color:var(--mute);font-size:12.5px;margin-top:14px;line-height:1.5}
kbd{font:11.5px Inter,sans-serif;border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 4px;background:var(--paper)}
#menu{position:fixed;z-index:20;display:none;background:var(--paper);border:1px solid var(--line);border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,.14);padding:4px;min-width:210px}
#menu button{display:flex;width:100%;justify-content:space-between;gap:16px;border:0;background:none;padding:8px 10px;border-radius:5px;text-align:left}
#menu button:hover{background:var(--mist)}
#menu hr{border:0;border-top:1px solid var(--line);margin:4px 0}
#menu small{color:var(--mute)}
#dlg{position:fixed;inset:0;z-index:30;display:none;place-items:center;background:rgba(0,0,0,.35);padding:16px}
#dlg>div{background:var(--paper);border-radius:12px;width:min(640px,100%);max-height:90%;overflow:auto;padding:20px;box-shadow:0 16px 48px rgba(0,0,0,.25)}
#dlg h2{font:600 22px/1.1 "Space Grotesk",Inter,sans-serif;margin:0 0 12px;letter-spacing:-.02em}
#dlg textarea{width:100%;min-height:240px;font:13px/1.45 ui-monospace,Menlo,monospace;border:1px solid var(--line);border-radius:8px;padding:10px;background:var(--chrome)}
#dlg .acts{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-top:12px}
.flist{display:grid;gap:6px}
.fi{display:flex;gap:8px;align-items:center;border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.fi.on{border-color:var(--acc);background:var(--mist)}
.fi b{flex:1;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fi small{color:var(--mute);white-space:nowrap}
.tpl{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-bottom:14px}
.tpl button{border:1px solid var(--line);border-radius:8px;background:var(--chrome);padding:12px;text-align:left;min-height:72px}
.tpl button:hover{border-color:var(--acc)}
.tpl b{display:block;margin-bottom:2px}.tpl span{color:var(--mute);font-size:12.5px}
.row2{display:flex;gap:6px;flex-wrap:wrap}.row2 input{flex:1 1 200px;border:1px solid var(--line);border-radius:6px;padding:7px 8px;background:var(--paper);font-size:15px}
.hl2{display:block;font-size:13px;color:var(--mute);margin:10px 0 4px}
#dlg details{margin-top:12px;border-top:1px solid var(--line);padding-top:10px}#dlg summary{cursor:pointer;font-weight:600}
#dlg textarea.pr{min-height:110px;margin:8px 0}
.gh3{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1.4fr) minmax(0,1fr);gap:6px}.gh3 input{border:1px solid var(--line);border-radius:6px;padding:7px 8px;background:var(--paper);font-size:14px}
@media(max-width:600px){.gh3{grid-template-columns:minmax(0,1fr)}}
h3.lib{font:600 16px/1.2 "Space Grotesk",Inter,sans-serif;margin:18px 0 8px}
.k2{display:flex !important;align-items:center;gap:6px;margin:0 !important;color:var(--ink) !important;font-size:13.5px !important}
#toast{position:fixed;left:50%;bottom:56px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:8px;display:none;z-index:40;font-size:13.5px}
#fmt{display:none}
#ask{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);width:min(660px,calc(100% - 24px));z-index:6;display:flex;flex-direction:column;gap:6px}
#askF{display:flex;gap:6px;align-items:center;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:6px;box-shadow:0 6px 20px rgba(0,0,0,.12)}
#askF:focus-within{border-color:var(--acc)}
#askIn{flex:1;border:0;background:none;font-size:16px;padding:8px 6px;outline:none}
#askTier{border:1px solid var(--line);border-radius:6px;background:var(--chrome);height:36px;font-size:13px;padding:0 4px}
#mic{width:44px;height:44px;flex:none;border-radius:50%;border:1px solid var(--line);background:var(--mist);display:grid;place-items:center}
#mic svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round}
#mic.rec{background:var(--danger);border-color:var(--danger);color:#fff;animation:pulse 1.4s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 8px color-mix(in srgb,var(--danger) 25%,transparent)}}
#askOut{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:10px 12px;box-shadow:0 6px 20px rgba(0,0,0,.1);font-size:14px}
#askOut p{margin:0}#askOut small{color:var(--mute)}
#askOut.ok{display:flex;align-items:center;gap:10px;flex-wrap:wrap}#askOut.ok>div:first-child{flex:1}
#askOut.err{border-color:var(--danger)}#askOut.ok{border-color:var(--acc)}
#askOut .aa{display:flex;gap:6px}#askOut .aa .btn{height:32px}
.exs{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.ex{border:1px solid var(--line);background:var(--chrome);border-radius:16px;padding:6px 10px;font-size:13px;text-align:left}
.ex:hover{border-color:var(--acc)}
.spin{display:inline-block;width:12px;height:12px;border:2px solid var(--acc);border-right-color:transparent;border-radius:50%;animation:sp 1s linear infinite;vertical-align:-1px;margin-right:4px}
@keyframes sp{to{transform:rotate(360deg)}}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--danger);margin-right:4px}
@media(max-width:600px){#askTier{display:none}#ask{bottom:8px}}
@media(pointer:coarse){.port{pointer-events:none}.nd.sel .port,#svg.linking .port{pointer-events:auto}}
@media(prefers-reduced-motion:reduce){#mic.rec,.spin{animation:none}}
@media(max-width:860px){
#app{grid-template:"top" auto "pal" auto "cv" minmax(0,1fr) "tabs" auto/minmax(0,1fr)}
#pal{border-right:0;border-bottom:1px solid var(--line);display:flex;gap:4px;overflow-x:auto;padding:6px 8px}
#pal h3{display:none}.sg{display:flex;gap:2px;flex:none}.si{flex:none;width:58px}.si.wide{width:auto;flex-direction:column;gap:2px;font-size:11.5px;color:var(--mute);padding:6px 4px 4px}
#insp{position:fixed;left:0;right:0;bottom:0;max-height:58%;z-index:15;border:0;border-top:1px solid var(--line);box-shadow:0 -8px 24px rgba(0,0,0,.15);transform:translateY(105%);transition:transform .2s}
#insp.open{transform:none}
#fmt{display:inline-flex}
.lbl{display:none}
#status{margin-left:0;order:9;width:100%;padding:0 8px}
}
@media(prefers-reduced-motion:reduce){*{transition:none !important}}
</style>
</head>
<body>
<div id="app">
  <header id="top">
    <input id="fname" type="text" aria-label="Diagram name" value="Untitled diagram">
    <div class="grp">
      <button class="tb" id="bFile" title="Files: new, open, import, export"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg><span class="lbl">File</span></button>
      <button class="tb" id="bHand" title="Hand off to AI: build spec, library, GitHub"><svg viewBox="0 0 24 24"><path d="M5 12h12M13 6l6 6-6 6"/><path d="M5 5v14"/></svg><span class="lbl">Hand off</span></button>
    </div>
    <div class="grp">
      <button class="tb" id="bUndo" title="Undo (Ctrl+Z)"><svg viewBox="0 0 24 24"><path d="M9 14 4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/></svg></button>
      <button class="tb" id="bRedo" title="Redo (Ctrl+Shift+Z)"><svg viewBox="0 0 24 24"><path d="m15 14 5-5-5-5"/><path d="M20 9H10a6 6 0 0 0 0 12h3"/></svg></button>
      <button class="tb" id="bDel" title="Delete (Del)"><svg viewBox="0 0 24 24"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg></button>
    </div>
    <div class="grp">
      <button class="tb" id="bLine" title="Connector style for new lines"><svg viewBox="0 0 24 24"><path d="M4 18h7V6h9"/></svg><span class="lbl" id="lineLbl">Elbow</span></button>
      <button class="tb on" id="bSnap" title="Snap to grid"><svg viewBox="0 0 24 24"><path d="M4 4v16M10 4v16M16 4v16M4 10h16M4 16h16"/></svg><span class="lbl">Snap</span></button>
    </div>
    <div class="grp">
      <button class="tb" id="bZo" title="Zoom out">−</button>
      <span id="zoomv">100%</span>
      <button class="tb" id="bZi" title="Zoom in">+</button>
      <button class="tb" id="bFit" title="Fit to screen (0)"><svg viewBox="0 0 24 24"><path d="M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5"/></svg></button>
      <button class="tb" id="fmt" title="Show format panel">Format</button>
    </div>
    <span id="status">Saved in this browser</span>
  </header>
  <nav id="pal" aria-label="Shapes"></nav>
  <main id="cv">
    <svg id="svg" xmlns="http://www.w3.org/2000/svg"><g id="world"></g></svg>
    <textarea id="ed" spellcheck="false" aria-label="Edit text"></textarea>
    <div id="ask">
      <div id="askOut" hidden aria-live="polite"></div>
      <form id="askF" autocomplete="off">
        <button type="button" id="mic" title="Speak a change" aria-label="Speak a change" hidden><svg viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></button>
        <input id="askIn" type="text" aria-label="Describe a change" placeholder="Describe a change, e.g. add a payments table linked to orders">
        <select id="askTier" aria-label="Speed" title="Smart is more careful; Fast answers sooner"><option value="default">Smart</option><option value="quick">Fast</option></select>
        <button class="btn pri" id="askGo" type="submit">Do it</button>
      </form>
    </div>
    <div id="hint">Drag shapes in · drag from a dot to connect · drag empty space to pan, pinch to zoom</div>
  </main>
  <div id="tabs"></div>
  <aside id="insp" aria-label="Format"></aside>
</div>
<div id="menu"></div>
<div id="dlg"><div id="dlgb"></div></div>
<div id="toast"></div>
<input type="file" id="fileIn" accept=".json,application/json" hidden>
<script>
{
const $=s=>document.querySelector(s);
const svg=$('#svg'),world=$('#world'),cv=$('#cv'),insp=$('#insp'),ed=$('#ed');
const COARSE=matchMedia('(pointer:coarse)').matches,PR=COARSE?8:4.5,HS=COARSE?20:10;
const GRID=10,HEAD=32,ROW=24,LANEH=28;
const uid=()=>Math.random().toString(36).slice(2,10);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clone=o=>JSON.parse(JSON.stringify(o));

/* ---------- colours: [light fill, light stroke, dark fill, dark stroke] ---------- */
const COLORS={slate:['#ffffff','#2f3640','#0d1c15','#a9b8b0'],green:['#e3f6ec','#0b8a52','#0f2a1d','#4fdc9b'],blue:['#e4eefb','#2759a8','#12223a','#86b4f2'],
amber:['#fdf1d6','#9a6200','#2c220d','#f0c060'],red:['#fde6e4','#b3261e','#321615','#f4928a'],purple:['#efe7fb','#6a3db3','#231936','#c4a5f5'],grey:['#eef1f0','#66706b','#1a2520','#a1aea7']};
{let css=':root{';for(const k in COLORS){const c=COLORS[k];css+=`--f-${k}:light-dark(${c[0]},${c[2]});--s-${k}:light-dark(${c[1]},${c[3]});`}
document.head.insertAdjacentHTML('beforeend',`<style>${css}}</style>`)}
let EXPORT=false;
const F=c=>EXPORT?COLORS[c||'slate'][0]:`var(--f-${c||'slate'})`;
const S=c=>EXPORT?COLORS[c||'slate'][1]:`var(--s-${c||'slate'})`;
const INK=()=>EXPORT?'#0b0b10':'var(--ink)',MUTE=()=>EXPORT?'#5b6470':'var(--mute)',PAPER=()=>EXPORT?'#ffffff':'var(--paper)';

/* ---------- shape library ---------- */
const SHAPES={
 process:{n:'Process',w:140,h:64},decision:{n:'Decision',w:140,h:90},terminator:{n:'Start / end',w:140,h:52},
 data:{n:'Data',w:140,h:64},document:{n:'Document',w:140,h:70},database:{n:'Database',w:110,h:80},
 subprocess:{n:'Subprocess',w:150,h:64},manual:{n:'Manual input',w:140,h:64},prep:{n:'Preparation',w:150,h:64},
 delay:{n:'Delay',w:120,h:64},circle:{n:'Connector',w:48,h:48},offpage:{n:'Off-page',w:64,h:64},
 note:{n:'Note',w:150,h:80,c:'amber'},text:{n:'Text',w:140,h:40}};
function outline(t,w,h){
 const k=Math.min(18,w*.15);
 switch(t){
 case 'decision':return `<path d="M${w/2} 0L${w} ${h/2}L${w/2} ${h}L0 ${h/2}Z"/>`;
 case 'terminator':return `<rect width="${w}" height="${h}" rx="${h/2}"/>`;
 case 'data':return `<path d="M${k} 0H${w}L${w-k} ${h}H0Z"/>`;
 case 'document':return `<path d="M0 0H${w}V${h*.82}C${w*.75} ${h*.62} ${w*.25} ${h*1.08} 0 ${h*.86}Z"/>`;
 case 'database':{const e=Math.min(14,h*.18);return `<path d="M0 ${e}V${h-e}A${w/2} ${e} 0 0 0 ${w} ${h-e}V${e}A${w/2} ${e} 0 0 0 0 ${e}Z"/><path d="M0 ${e}A${w/2} ${e} 0 0 0 ${w} ${e}" fill="none"/>`}
 case 'subprocess':return `<rect width="${w}" height="${h}" rx="2"/><path d="M10 0V${h}M${w-10} 0V${h}" fill="none"/>`;
 case 'manual':return `<path d="M0 ${h*.28}L${w} 0V${h}H0Z"/>`;
 case 'prep':return `<path d="M${k} 0H${w-k}L${w} ${h/2}L${w-k} ${h}H${k}L0 ${h/2}Z"/>`;
 case 'delay':{const r=Math.min(h/2,w/2);return `<path d="M0 0H${w-r}A${r} ${h/2} 0 0 1 ${w-r} ${h}H0Z"/>`}
 case 'circle':return `<ellipse cx="${w/2}" cy="${h/2}" rx="${w/2}" ry="${h/2}"/>`;

function marker(m,p,col){

function setStatus(t){$('#status').textContent=t}
function queueSave(){clearTimeout(saveT);setStatus('Unsaved changes');saveT=setTimeout(saveNow,1200)}
async function saveNow(){
 const okLocal=LS.put(doc);
 if(!remote){setStatus(okLocal?'Saved in this browser':'Not saved: storage is unavailable');return}
 if(saving){again=true;return}saving=true;setStatus('Saving…');
 try{const json=JSON.stringify(doc);if(json.length>250000)throw{code:'too_big'};
  await remote.col.doc(doc.id).set({name:doc.name,updated:doc.updated,json});setStatus('Saved to your account')}
 catch(e){setStatus(e.code==='too_big'?'Too large to sync; saved in this browser':e.code==='quota_exceeded'?'Storage full; delete old diagrams':'Saved in this browser only')}
 saving=false;if(again){again=false;saveNow()}
}
async function listFiles(){
 const map={};for(const[id,f]of Object.entries(LS.all()))map[id]={id,name:f.name,updated:f.updated,src:'local'};
 if(remote){try{const s=await remote.col.get();for(const d of s.docs){const x=d.data();if(!map[d.id]||map[d.id].updated<=x.updated)map[d.id]={id:d.id,name:x.name,updated:x.updated,src:'remote'}}}catch{}}
 if(!map[doc.id])map[doc.id]={id:doc.id,name:doc.name,updated:doc.updated};
 return Object.values(map).sort((a,b)=>b.updated-a.updated);
}
async function loadFile(id){
 let best=null;const l=LS.all()[id];if(l)best={updated:l.updated,json:l.json};
 if(remote){try{const s=await remote.col.doc(id).get();if(s.exists){const x=s.data();if(!best||x.updated>best.updated)best=x}}catch{}}
 if(!best)return toast('Could not open that diagram');
 openDoc(JSON.parse(best.json));
}
function openDoc(d){doc=d;last=JSON.stringify(doc);undo.length=0;redo.length=0;sel=[];selEdge=null;selField=null;views={};page=P();$('#fname').value=doc.name;render();renderTabs();renderPanel();requestAnimationFrame(fit);LS.put(doc)}
async function connectStore(){
 try{if(!window.claude?.use)return;const[d,u]=await Promise.all([claude.use('db'),claude.use('user')]);if(!d||!u)return;
  const id=await u.id();if(!id)return;remote={db:d,col:d.collection('data/users/'+id)};
  const s=await remote.col.get();const have=new Set(s.docs.map(x=>x.id));
  for(const[fid,f]of Object.entries(LS.all()))if(!have.has(fid)){try{await remote.col.doc(fid).set({name:f.name,updated:f.updated,json:f.json})}catch{}}
  const mine=s.docs.find(x=>x.id===doc.id);
  if(mine&&mine.data().updated>doc.updated)openDoc(JSON.parse(mine.data().json));
  else if(!mine&&untouched&&s.docs.length){const top=s.docs.map(x=>x.data()).sort((a,b)=>b.updated-a.updated)[0];openDoc(JSON.parse(top.json))}
  setStatus('Saved to your account');
 }catch{remote=null}
}

function remap(p){const m={};for(const n of p.nodes){m[n.id]=uid();n.id=m[n.id];if(n.fields)for(const f of n.fields){m[f.id]=uid();f.id=m[f.id]}if(n.lanes)n.lanes.forEach(l=>l.id=uid())}
 for(const e of p.edges){e.id=uid();e.a.n=m[e.a.n];e.b.n=m[e.b.n];if(e.a.f)e.a.f=m[e.a.f];if(e.b.f)e.b.f=m[e.b.f]}return m}

function paste(dx=30){if(!clip)return;const p=clone(clip);const m=remap(p);for(const n of p.nodes){n.x+=dx;n.y+=dx}
 page.nodes.push(...p.nodes);page.edges.push(...p.edges);sel=p.nodes.map(n=>n.id);selEdge=null;clip.nodes.forEach(n=>{n.x+=dx;n.y+=dx});changed()}

function align(k){
 const ns=sel.map(N).filter(Boolean),bs=ns.map(bounds);
 const minX=Math.min(...bs.map(b=>b.x)),maxX=Math.max(...bs.map(b=>b.x+b.w)),minY=Math.min(...bs.map(b=>b.y)),maxY=Math.max(...bs.map(b=>b.y+b.h));
 ns.forEach((n,i)=>{const b=bs[i];
  if(k==='l')n.x=minX;if(k==='r')n.x=maxX-b.w;if(k==='c')n.x=Math.round((minX+maxX)/2-b.w/2);
  if(k==='t')n.y=minY;if(k==='b')n.y=maxY-b.h;if(k==='m')n.y=Math.round((minY+maxY)/2-b.h/2)});
 if(k==='dh'||k==='dv'){const ax=k==='dh'?'x':'y',dim=k==='dh'?'w':'h';const o=ns.map((n,i)=>({n,b:bs[i]})).sort((p,q)=>p.b[ax]-q.b[ax]);
  const tot=o.reduce((a,p)=>a+p.b[dim],0),span=(k==='dh'?maxX-minX:maxY-minY),gap=(span-tot)/Math.max(1,o.length-1);let pos=k==='dh'?minX:minY;
  for(const p of o){p.n[ax]=Math.round(pos);pos+=p.b[dim]+gap}}
 changed();
}

 else{const d=SHAPES[type];n={id:uid(),type,x:x-d.w/2,y:y-d.h/2,w:d.w,h:d.h,label:type==='text'?'Text':d.n,c:d.c||'slate'}}
 if(snap){n.x=Math.round(n.x/GRID)*GRID;n.y=Math.round(n.y/GRID)*GRID}
 page.nodes.push(n);sel=[n.id];selEdge=null;selField=null;changed();return n;
}

function endpointAt(ev,exclude){

 else if(n.type==='table'&&el.dataset.field)end.f=el.dataset.field;
 return end;
}

function contentBox(nodes){const bs=nodes.map(bounds);if(!bs.length)return null;
 let x0=Math.min(...bs.map(b=>b.x)),y0=Math.min(...bs.map(b=>b.y)),x1=Math.max(...bs.map(b=>b.x+b.w)),y1=Math.max(...bs.map(b=>b.y+b.h));return{x:x0,y:y0,w:x1-x0,h:y1-y0}}

let editing=null;
function placeEd(x,y,w,h,val,fs,align='center'){
 const v=view();Object.assign(ed.style,{display:'block',left:x*v.z+v.x+'px',top:y*v.z+v.y+'px',width:Math.max(80,w*v.z)+'px',height:Math.max(30,h*v.z)+'px',fontSize:fs*v.z+'px',textAlign:align});

}
function editNode(n,fid,laneId){
 if(n.type==='table'){
  if(fid){const f=n.fields.find(f=>f.id===fid);const i=n.fields.indexOf(f);editing={n,f};placeEd(n.x+28,n.y+HEAD+i*ROW,n.w-30,ROW,`${f.name} ${f.type}`,13,'left')}
  else{editing={n,k:'name'};placeEd(n.x,n.y,n.w,HEAD,n.name,14,'left')}
 }else if(n.type==='pool'){
  if(laneId){const l=n.lanes.find(l=>l.id===laneId);editing={n,l};const b=bounds(n);let off=0;for(const x of n.lanes){if(x===l)break;off+=x.size}
   n.dir==='v'?placeEd(n.x+off,n.y+LANEH,l.size,LANEH,l.name,13):placeEd(n.x+LANEH,n.y+off+l.size/2-15,160,30,l.name,13)}
  else{editing={n,k:'title'};placeEd(n.x,n.y,200,30,n.title,14)}
 }else{editing={n,k:'label'};placeEd(n.x,n.y,n.w,n.h,n.label,n.fs||14)}
}
function editEdge(e){const g=edgeGeom(e);const m=midOf(g.pts);editing={e};placeEd(m.x-60,m.y-15,120,30,e.label,12.5)}
function commitEdit(cancel){
 if(!editing)return;const v=ed.value,x=editing;editing=null;ed.style.display='none';if(cancel)return render();
 if(x.e)x.e.label=v.trim();
 else if(x.f){const m=v.trim().match(/^(\S+)\s*(.*)$/);if(m){x.f.name=m[1];x.f.type=m[2]||x.f.type}}
 else if(x.l)x.l.name=v;
 else if(x.k==='name')x.n.name=v.trim().replace(/\s+/g,'_')||x.n.name;
 else x.n[x.k]=v;
 changed();
}

document.addEventListener('keydown',ev=>{

 const mod=ev.ctrlKey||ev.metaKey,k=ev.key.toLowerCase();
 if(k===' '){space=true;cv.style.cursor='grab';ev.preventDefault();return}
 if(mod&&k==='z'){ev.preventDefault();ev.shiftKey?doRedo():doUndo()}
 else if(mod&&k==='y'){ev.preventDefault();doRedo()}
 else if(mod&&k==='c')copySel();
 else if(mod&&k==='v'){ev.preventDefault();paste()}
 else if(mod&&k==='d'){ev.preventDefault();dup()}
 else if(mod&&k==='a'){ev.preventDefault();sel=page.nodes.map(n=>n.id);selEdge=null;render();renderPanel()}
 else if(k==='delete'||k==='backspace'){if(sel.length||selEdge){ev.preventDefault();del()}}
 else if(k==='escape'){sel=[];selEdge=null;selField=null;render();renderPanel();closeMenu()}
 else if(k.startsWith('arrow')&&sel.length){ev.preventDefault();const s=ev.shiftKey?GRID*2:snap?GRID:1;const[dx,dy]={arrowleft:[-s,0],arrowright:[s,0],arrowup:[0,-s],arrowdown:[0,s]}[k];
  const ids=new Set(sel);for(const id of sel){const m=N(id);if(m?.type==='pool')poolChildren(m).forEach(c=>ids.add(c))}
  for(const id of ids){const m=N(id);m.x+=dx;m.y+=dy}changed(false)}
 else if(k==='0')fit();else if(k==='='||k==='+')zoomBy(1.2);else if(k==='-')zoomBy(1/1.2);
 else if(k==='/'||(mod&&k==='k')){ev.preventDefault();askIn.focus()}
 else if(k==='enter'&&sel.length===1){ev.preventDefault();editNode(N(sel[0]))}
});

/* ---------- SQL ---------- */
function splitTop(s){const out=[];let d=0,cur='';for(const ch of s){if(ch==='(')d++;if(ch===')')d--;if(ch===','&&d===0){out.push(cur);cur=''}else cur+=ch}if(cur.trim())out.push(cur);return out.map(x=>x.trim())}
const unq=s=>s.replace(/[`"\[\]]/g,'').split('.').pop();
function importSQL(txt){
 const re=/create\s+table\s+(?:if\s+not\s+exists\s+)?([`"\[\]\w.]+)\s*\(/gi;let m;const found=[];
 while((m=re.exec(txt))){let i=re.lastIndex,d=1;while(i<txt.length&&d){if(txt[i]==='(')d++;else if(txt[i]===')')d--;i++}found.push({name:unq(m[1]),body:txt.slice(re.lastIndex,i-1)})}
 if(!found.length){toast('No CREATE TABLE statements found');return false}
 const box=contentBox(page.nodes),x0=box?box.x+box.w+80:40,y0=box?box.y:40,made={},refs=[];
 found.forEach((t,ti)=>{
  const n={id:uid(),type:'table',x:x0+(ti%3)*290,y:y0,w:240,name:t.name,c:'green',fields:[]};
  for(const part of splitTop(t.body)){
   let mm;
   if((mm=part.match(/^(?:constraint\s+\S+\s+)?primary\s+key\s*\(([^)]+)\)/i))){mm[1].split(',').map(x=>unq(x.trim())).forEach(c=>{const f=n.fields.find(f=>f.name===c);if(f){f.pk=true;f.nn=true}});continue}
   if((mm=part.match(/^(?:constraint\s+\S+\s+)?foreign\s+key\s*\(([^)]+)\)\s*references\s+([`"\[\]\w.]+)\s*\(([^)]+)\)/i))){refs.push({t:n,c:unq(mm[1].trim()),rt:unq(mm[2]),rc:unq(mm[3].trim())});continue}
   if(/^(unique|index|key|check|constraint)\b/i.test(part))continue;
   const cm=part.match(/^([`"\[\]\w]+)\s+(.+)$/s);if(!cm)continue;
   const rest=cm[2],type=(rest.match(/^[\w]+(\s*\([^)]*\))?(\s+unsigned)?(\s+varying(\s*\([^)]*\))?)?/i)||[''])[0].replace(/\s+/g,' ');
   const f=F_(unq(cm[1]),type.toLowerCase(),{pk:/primary\s+key/i.test(rest),nn:/not\s+null|primary\s+key/i.test(rest)});if(/\bunique\b/i.test(rest))f.uq=true;{const dm=rest.match(/\bdefault\s+('(?:[^']|'')*'|\S+?)(?=\s|$|,)/i);if(dm)f.def=dm[1]}{const cmm=rest.match(/\bcomment\s+'((?:[^']|'')*)'/i);if(cmm)f.desc=cmm[1].replace(/''/g,"'")}
   const r=rest.match(/references\s+([`"\[\]\w.]+)\s*\(([^)]+)\)/i);if(r){f.fk=true;refs.push({t:n,c:f.name,rt:unq(r[1]),rc:unq(r[2].trim())})}
   n.fields.push(f)}
  made[n.name.toLowerCase()]=n;page.nodes.push(n)});
 let y=[y0,y0,y0];found.forEach((t,ti)=>{const n=made[t.name.toLowerCase()];const col=ti%3;n.y=y[col];y[col]+=tblH(n)+50});
 const all=t=>made[t.toLowerCase()]||page.nodes.find(n=>n.type==='table'&&n.name.toLowerCase()===t.toLowerCase());
 let links=0;for(const r of refs){const tn=all(r.rt);if(!tn)continue;const fa=r.t.fields.find(f=>f.name===r.c),fb=tn.fields.find(f=>f.name===r.rc);if(!fa)continue;fa.fk=true;
  page.edges.push({id:uid(),a:{n:r.t.id,f:fa.id},b:{n:tn.id,f:fb?.id||null},st:'orth',sa:'0N',sb:'11',label:''});links++}
 sel=Object.values(made).map(n=>n.id);changed();fit();toast(`Added ${found.length} table${found.length>1?'s':''} and ${links} relationship${links===1?'':'s'}`);return true;
}
function toSQL(tables){
 return tables.map(n=>{const lines=n.fields.map(f=>`  ${f.name} ${(f.type||'text').toUpperCase()}${f.nn&&!f.pk?' NOT NULL':''}${f.uq&&!f.pk?' UNIQUE':''}${f.def?' DEFAULT '+f.def:''}`);
  const pk=n.fields.filter(f=>f.pk);if(pk.length)lines.push(`  PRIMARY KEY (${pk.map(f=>f.name).join(', ')})`);
  for(const e of page.edges){for(const[me,other]of[[e.a,e.b],[e.b,e.a]]){if(me.n!==n.id||!me.f||!other.f)continue;const f=n.fields.find(f=>f.id===me.f);const on=N(other.n),of=on?.fields?.find(x=>x.id===other.f);
   if(f&&of&&f.fk&&!(of.fk&&!of.pk&&f.pk))lines.push(`  FOREIGN KEY (${f.name}) REFERENCES ${on.name}(${of.name})`)}}
  const cm=[n.desc?`-- ${n.name}: ${n.desc.replace(/\s+/g,' ').trim()}`:'',...n.fields.filter(f=>f.desc).map(f=>`--   ${f.name}: ${f.desc.replace(/\s+/g,' ').trim()}`)].filter(Boolean).join('\n');
  return `${cm?cm+'\n':''}CREATE TABLE ${n.name} (\n${lines.join(',\n')}\n);`}).join('\n\n');
}

function snapshotForAI(){
 const r=v=>Math.round(v);
 const tables=[],shapes=[],pools=[];
 for(const n of page.nodes){const b=bounds(n);
  if(n.type==='table')tables.push({id:n.id,name:n.name,x:r(b.x),y:r(b.y),w:r(b.w),h:r(b.h),color:n.c,description:n.desc||undefined,fields:n.fields.map(f=>({id:f.id,name:f.name,type:f.type,description:f.desc||undefined,default:f.def||undefined,examples:f.ex||undefined,...(f.uq?{unique:true}:{}),...(f.pk?{pk:true}:{}),...(f.fk?{fk:true}:{}),...(f.nn?{nn:true}:{})}))});
  else if(n.type==='pool'){let off=n.dir==='v'?n.x:n.y;pools.push({id:n.id,title:n.title,dir:n.dir,x:r(b.x),y:r(b.y),w:r(b.w),h:r(b.h),color:n.c,lanes:n.lanes.map(l=>{const o={name:l.name,from:r(off),to:r(off+l.size)};off+=l.size;return o})})}
  else shapes.push({id:n.id,type:n.type,label:n.label,x:r(b.x),y:r(b.y),w:r(b.w),h:r(b.h),color:n.c})}
 const connectors=page.edges.map(e=>({id:e.id,from:e.a.n,...(e.a.f?{fromField:e.a.f}:{}),to:e.b.n,...(e.b.f?{toField:e.b.f}:{}),label:e.label||undefined,start:e.sa,end:e.sb,style:e.st}));
 return{page:page.name,notes:page.notes||undefined,otherPages:doc.pages.filter(p=>p!==page).map(p=>p.name),selected:selEdge?[selEdge]:sel,tables,pools,shapes,connectors};
}
const AI_RULES=`You edit diagrams in Diagram Studio, a web diagram editor for table relationship diagrams (ERDs) and process maps with swimlanes.
You get the current page as JSON and a request from the user, often spoken aloud, so expect loose wording and speech-to-text mistakes; infer the intent.
Reply with ONLY one JSON object: {"summary": string, "ops": Op[]}.
"summary" is one or two short plain sentences saying what you changed (or answering a question, or asking for the one detail you need, with ops []).

Coordinates are pixels, x right, y down, 10px grid. Leave about 60-80px between objects. Tables are about 230 wide; height is 38 + 24 per field. Flowchart shapes are about 140x64 (decision 140x90). Omit x and y to let the editor place new objects automatically to the right of existing content.
Refer to existing objects by id, or by exact table name / shape label / pool title. Give new objects a "ref" string so later ops in the same reply can refer to them by that ref.
Fields are referred to by field id or field name.
Colours: slate, green, blue, amber, red, purple, grey.
Shape types: process, decision, terminator (start/end), data, document, database, subprocess, manual, prep, delay, circle, offpage, note, text.
Connector ends: none, arrow, open, 1, 11 (exactly one), 01 (zero or one), N (many), 1N (one or many), 0N (zero or many). Styles: orth, straight, curve.

Ops (all keys besides "op" optional unless noted):
{"op":"add_table","ref","name"*,"description","x","y","color","fields":[{"name"*,"type","pk","fk","nn","unique","default","description","examples"}]}
{"op":"update_table","id"*,"name","description","color"}
{"op":"add_field","table"*,"name"*,"type","pk","fk","nn","unique","default","description","examples","after":field}
{"op":"update_field","table"*,"field"*,"name","type","pk","fk","nn","unique","default","description","examples"}
{"op":"set_notes","text"*}   // replaces the page's notes for the builder
{"op":"remove_field","table"*,"field"*}
{"op":"add_shape","ref","type"*,"label","x","y","color","pool","lane"}   // pool+lane (lane name) puts it inside that swimlane
{"op":"update_shape","id"*,"label","type","color","w","h"}
{"op":"add_pool","ref","title","dir":"h"|"v","lanes":[names],"x","y"}
{"op":"update_pool","id"*,"title","color","lanes":[names]}   // lanes replaces the lane list, keeping sizes of lanes whose names stay
{"op":"connect","from"*,"to"*,"fromField","toField","label","start","end","style","dashed"}
{"op":"update_connector","id"*,"label","start","end","style","dashed","color"}
{"op":"move","id"*,"x","y","dx","dy"}
{"op":"delete","id"*}   // a shape, table, pool or connector; connectors on a deleted object go too
{"op":"layout"}   // tidy all tables on this page into a neat grid
{"op":"add_page","name"*}  {"op":"switch_page","name"*}  {"op":"rename_page","name"*}

Conventions: for a foreign key, connect FROM the child table's FK field TO the parent's primary key field with start "0N" (or "1N") and end "11"; mark the child field fk true. Name tables in snake_case. New tables normally get an id primary key. In process maps connect steps in order with end "arrow"; label decision branches (Yes / No). Put each step in the lane of whoever does it. "Selected" means the ids in "selected".`;
function aiPrompt(text){
 const hist=convo.slice(-4).map(c=>`User: ${c.u}\nYou: ${c.s}`).join('\n');

}
function applyOps(ops){
 const refs={},made=[];let done=0,skipped=0,auto=null,needFit=!page.nodes.length;
 const name=n=>(n.type==='table'?n.name:n.type==='pool'?n.title:n.label)||'';
 const R=v=>{if(v==null)return null;v=String(v);if(refs[v])return refs[v];if(N(v))return v;const lv=v.toLowerCase().trim();return(page.nodes.find(n=>name(n).toLowerCase()===lv)||page.nodes.find(n=>name(n).toLowerCase().replace(/[\s_]+/g,'')===lv.replace(/[\s_]+/g,'')))?.id||null};
 const NR=v=>{const id=R(v);const n=id&&N(id);if(!n)throw Error('not found: '+v);return n};
 const FD=(n,f)=>{if(!n.fields||f==null)return null;f=String(f).toLowerCase();return n.fields.find(x=>x.id===f)||n.fields.find(x=>x.name.toLowerCase()===f)||null};
 const col=c=>COLORS[c]?c:undefined,mk=m=>MARKS.some(x=>x[0]===m)?m:undefined,sty=s=>['orth','straight','curve'].includes(s)?s:undefined;
 const num=v=>typeof v==='number'&&isFinite(v)?v:undefined;
 const autoPos=(w,h)=>{if(!auto){const b=contentBox(page.nodes.filter(n=>!made.includes(n.id)));auto={x:b?b.x+b.w+80:60,y0:b?b.y:60,y:b?b.y:60,cw:0}}
  if(auto.y-auto.y0>520){auto.x+=auto.cw+70;auto.y=auto.y0;auto.cw=0}const p={x:auto.x,y:auto.y};auto.y+=h+60;auto.cw=Math.max(auto.cw,w);return p};
 const fld=f=>{const x=F_(String(f.name||'field').replace(/\s+/g,'_'),String(f.type||'varchar(50)'),{pk:f.pk,fk:f.fk,nn:f.nn||f.pk});if(f.unique)x.uq=true;if(f.default!=null)x.def=String(f.default);if(f.description)x.desc=String(f.description);if(f.examples)x.ex=String(f.examples);return x};
 const lanesOf=(pool,names)=>names.map(nm=>{const old=pool?.lanes.find(l=>l.name===nm);return old||{id:uid(),name:String(nm),size:pool?.dir==='v'?220:140}});
 for(const o of Array.isArray(ops)?ops:[]){try{
  switch(o.op){
  case 'add_table':{const n={id:uid(),type:'table',x:0,y:0,w:230,name:String(o.name||'new_table').replace(/\s+/g,'_'),c:col(o.color)||'green',fields:(o.fields||[]).map(fld)};if(o.description)n.desc=String(o.description);
   if(!n.fields.length)n.fields.push(F_('id','int',{pk:1,nn:1}));
   const p=num(o.x)!=null&&num(o.y)!=null?{x:o.x,y:o.y}:autoPos(n.w,tblH(n));n.x=p.x;n.y=p.y;page.nodes.push(n);made.push(n.id);if(o.ref)refs[o.ref]=n.id;break}
  case 'update_table':{const n=NR(o.id);if(o.description!=null)n.desc=String(o.description);if(o.name)n.name=String(o.name).replace(/\s+/g,'_');if(col(o.color))n.c=o.color;break}
  case 'add_field':{const n=NR(o.table);if(!n.fields)throw Error('not a table');const f=fld(o);const a=FD(n,o.after);n.fields.splice(a?n.fields.indexOf(a)+1:n.fields.length,0,f);break}
  case 'update_field':{const n=NR(o.table),f=FD(n,o.field);if(!f)throw Error('no field');if(o.name)f.name=String(o.name).replace(/\s+/g,'_');if(o.type)f.type=String(o.type);for(const k of['pk','fk','nn'])if(typeof o[k]==='boolean')f[k]=o[k];if(typeof o.unique==='boolean')f.uq=o.unique;if(o.default!=null)f.def=String(o.default);if(o.description!=null)f.desc=String(o.description);if(o.examples!=null)f.ex=String(o.examples);break}
  case 'remove_field':{const n=NR(o.table),f=FD(n,o.field);if(!f)throw Error('no field');n.fields.splice(n.fields.indexOf(f),1);page.edges=page.edges.filter(e=>e.a.f!==f.id&&e.b.f!==f.id);break}
  case 'add_shape':{const type=SHAPES[o.type]?o.type:'process',d=SHAPES[type];const n={id:uid(),type,x:0,y:0,w:d.w,h:d.h,label:String(o.label??d.n),c:col(o.color)||d.c||'slate'};

   b.disabled=true;msg('<span class="spin"></span> Publishing…');
   try{const ref=remote.db.doc('handoffs/'+nm);const old=await ref.get();
    if(old.exists&&old.data().pageId&&old.data().pageId!==page.id&&page.handoff!==nm&&!b.dataset.sure){b.disabled=false;b.dataset.sure=1;b.textContent='Replace it';return msg(`“${esc(nm)}” already holds a handoff from another page (${esc(old.data().page||'')}). Click Replace it to overwrite, or pick another name.`)}
    const v=(old.exists?old.data().version||1:0)+1;
    await ref.set({name:nm,kind:'data-schema',diagram:doc.name,diagramId:doc.id,page:page.name,pageId:page.id,updated:Date.now(),version:v,markdown:sp.markdown,schema:sp.model});
    page.handoff=nm;changed(false);b.textContent='Update in library';delete b.dataset.sure;
    msg(`Published <b>${esc(nm)}</b> (version ${v}). Give an agent this prompt:<textarea readonly class="pr">${esc(agentPrompt(nm))}</textarea><button class="btn pri" data-hp="${esc(nm)}">Copy agent prompt</button>`);drawLib();
   }catch(e){msg(e?.code==='quota_exceeded'?'The library is full. Remove old handoffs and try again.':e?.code==='invalid_argument'?'You do not have permission to publish here, or the spec is too large.':'Could not publish just now. Try again.')}
   b.disabled=false;return}
  if(b.dataset.hp)return copyText(agentPrompt(b.dataset.hp),'Agent prompt copied');
  if(b.dataset.hd){if(!b.dataset.sure){b.dataset.sure=1;b.textContent='Remove?';return}try{await remote.db.doc('handoffs/'+b.dataset.hd).delete();if(page.handoff===b.dataset.hd){delete page.handoff;changed(false)}drawLib()}catch{toast('Could not remove it')}return}
  if(b.id==='ghCopy'){const o={repo:$('#ghRepo').value.trim(),path:$('#ghPath').value.trim(),branch:$('#ghBranch').value.trim()};ghSet(o);return copyText(ghPrompt(nm,o.repo,o.path||`docs/specs/${nm}.md`,o.branch),'GitHub instruction copied')}
 };
 $('#hoName').addEventListener('input',e=>{const p=$('#ghPath');if(p)p.placeholder=`docs/specs/${slugify(e.target.value)}.md`});
}

/* ---------- boot ---------- */
function start(){
 let d=null;try{const id=localStorage.getItem('diagram-studio-last');const f=id&&LS.all()[id];if(f)d=JSON.parse(f.json)}catch{}
 if(!d){d=sample();untouched=true}
 doc=d;last=JSON.stringify(doc);page=P();$('#fname').value=doc.name;renderTabs();render();renderPanel();requestAnimationFrame(fit);
 setStatus(untouched?'Sample diagram: edit it or start a new one':'Saved in this browser');
 const ro=new ResizeObserver(()=>render());ro.observe(cv);
 connectStore();connectAI();
}
start();
}
</script>

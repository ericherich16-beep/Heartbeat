            Visible: =varShowQs && varQMode = "" && !IsBlank(varQ) && varQ.QStatus.Value = "Open"
            Width: =446
            X: =(Parent.Width - 1100) / 2 + 640
            Y: =532
      - btnQMove:
          Control: Classic/Button@2.2.0
          Properties:
            BorderColor: =RGBA(17, 24, 39, 1)
            BorderThickness: =0
            Color: =Color.White
            DisabledColor: =RGBA(107, 114, 128, 1)
            DisabledFill: =RGBA(226, 231, 238, 1)
            DisplayMode: |-
              =If(IsBlank(varQMoveGate) || varQMoveGate = varQ.Gate || IsBlank(Trim(txtQMoveReason.Text)), DisplayMode.Disabled, DisplayMode.Edit)
            Fill: =RGBA(10, 92, 178, 1)
            FontWeight: =FontWeight.Semibold
            Height: =36
            OnSelect: |-
              =With(
                  {qid: varQ.ID, oldG: varQ.Gate, newG: varQMoveGate, why: Trim(txtQMoveReason.Text)},
                  IfError(
                      Patch('NPI Open Questions', LookUp('NPI Open Questions', ID = qid), {Gate: newG, GateMoveReason: "Gate " & oldG & " -> " & newG & ": " & why});
                      IfError(
                          Patch(
                              'NPI Activity Log',
                              Defaults('NPI Activity Log'),
                              {
                                  Title: "Q-" & qid & ": question moved",
                                  ProjectID: varProject.Title,
                                  RequirementID: "Q-" & qid,
                                  ActionType: {Value: "Question moved"},
                                  Detail: "Gate " & oldG & " -> " & newG,
                                  Reason: why,
                                  PerformedBy: varMeUser,
                                  PerformedDate: Now()
                              }
                          ),
                          Notify("Saved. The Activity Log entry failed: add the question choices to ActionType in NPI Activity Log.", NotificationType.Warning)
                      );
                      Refresh('NPI Open Questions');
                      ClearCollect(colQs, Filter('NPI Open Questions', ProjectID = varProject.Title));
                      Set(varQ, LookUp(colQs, ID = qid));
                      Set(varQMoveGate, Blank());
                      Reset(txtQMoveReason);
                      Notify("Question moved to Gate " & newG, NotificationType.Success),
                      Notify("Save failed: " & FirstError.Message, NotificationType.Error)
                  )
              )
            RadiusBottomLeft: =4
            RadiusBottomRight: =4
            RadiusTopLeft: =4
            RadiusTopRight: =4
            Size: =12
            Text: ="Move question"
            Visible: =varShowQs && varQMode = "" && !IsBlank(varQ) && varQ.QStatus.Value = "Open"
            Width: =170
            X: =(Parent.Width - 1100) / 2 + 640
            Y: =590
      - btnQReopen:
          Control: Classic/Button@2.2.0
          Properties:
            BorderColor: =RGBA(17, 24, 39, 1)
            BorderThickness: =1
            Color: =RGBA(17, 24, 39, 1)
            DisabledColor: =RGBA(107, 114, 128, 1)
            DisabledFill: =RGBA(226, 231, 238, 1)
            Fill: =Color.White
            FontWeight: =FontWeight.Semibold
            Height: =36
            OnSelect: |-
              =With(
                  {qid: varQ.ID},
                  IfError(
                      Patch('NPI Open Questions', LookUp('NPI Open Questions', ID = qid), {QStatus: {Value: "Open"}});
                      IfError(
                          Patch(
                              'NPI Activity Log',
                              Defaults('NPI Activity Log'),
                              {
                                  Title: "Q-" & qid & ": question added",
                                  ProjectID: varProject.Title,
                                  RequirementID: "Q-" & qid,
                                  ActionType: {Value: "Question added"},
                                  Detail: "Reopened",
                                  Reason: "",
                                  PerformedBy: varMeUser,
                                  PerformedDate: Now()
                              }
                          ),
                          Notify("Saved. The Activity Log entry failed: add the question choices to ActionType in NPI Activity Log.", NotificationType.Warning)
                      );
                      Refresh('NPI Open Questions');
                      ClearCollect(colQs, Filter('NPI Open Questions', ProjectID = varProject.Title));
                      Set(varQ, LookUp(colQs, ID = qid));
                      Notify("Question reopened", NotificationType.Success),
                      Notify("Save failed: " & FirstError.Message, NotificationType.Error)
                  )
              )
            RadiusBottomLeft: =4
            RadiusBottomRight: =4
            RadiusTopLeft: =4
            RadiusTopRight: =4
            Size: =12
            Text: ="Reopen question"
            Visible: =varShowQs && varQMode = "" && !IsBlank(varQ) && varQ.QStatus.Value = "Closed"
            Width: =170
            X: =(Parent.Width - 1100) / 2 + 640
            Y: =326

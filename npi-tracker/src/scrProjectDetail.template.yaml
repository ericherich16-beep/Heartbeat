                      mode: If(IsBlank(varRow.FileLink), "upload", "replace")
                  },
                  With(
                      {
                          finalName: If(
                              mode = "replace" && !IsBlank(varRow.FileName),
                              varRow.FileName,
                              If(CountRows(Filter(colReqs, ID <> rowId && FileName = f.Name)) > 0, rowTitle & "_" & f.Name, f.Name)
                          )
                      },
                      Set(varSaving, true);
                      Set(
                          varUp,
                          IfError(
                              NPIUploadFile.Run(
                                  mode,
                                  Coalesce(varProject.ProjectFolderUrl, varFolderName),
                                  finalName,
                                  "",
                                  varProject.Title,
                                  rowTitle,
                                  Text(varRow.Gate),

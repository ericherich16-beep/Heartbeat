# Power Apps canvas source for NPI Tracker 1.2.0.0 - Project details screen.
Screens:
  scrProjectDetail:
    Properties:
      Fill: =RGBA(244, 247, 251, 1)
      OnVisible: |-
        =If(IsBlank(varProject), Navigate(scrProjects));
        Set(varMe, Lower(User().Email));
        Set(varMeUser, {
            '@odata.type': "#Microsoft.Azure.Connectors.SharePoint.SPListExpandedUser",
            Claims: "i:0#.f|membership|" & varMe,
            Department: "",
            DisplayName: User().FullName,
            Email: varMe,
            JobTitle: "",
            Picture: ""
        });
        Refresh('NPI Role Defaults');
        Refresh('Project Requirements');
        Set(varQMEmail, Lower(Coalesce(LookUp('NPI Role Defaults', Role.Value = "QM").DefaultAssignee.Email, "")));
        Set(varIsQEorQM, Lower(Coalesce(varProject.QE.Email, "")) = varMe || varQMEmail = varMe);
        Set(varCurrentGate, Max(1, Min(4, Coalesce(varProject.CurrentGate, 1))));
        Set(varGate, varCurrentGate);
        Set(varDocFilter, "Needed");
        Set(varShowDetails, false);
        Set(varShowActivity, false);
        Set(varSaving, false);
        Set(varSelectedAssignee, Blank());
        Set(varRow, Blank());
        ClearCollect(colReqs, Filter('Project Requirements', ProjectID = varProject.Title));
        Set(
            varRow,
            First(
                SortByColumns(
                    Filter(colReqs, Gate = varGate && !(Status.Value in ["Reviewed", "N/A"])),
                    "SortOrder",
                    SortOrder.Ascending
                )
            )
        );
        __SET_CANREVIEW__;
        Reset(txtNote)
    Children:
      - rectDetailHeader:
          Control: Rectangle@2.3.0
          Properties:
            Fill: =RGBA(10, 92, 178, 1)
            Height: =88
            Width: =Parent.Width
            X: =0
            Y: =0
      - btnBack:
          Control: Classic/Button@2.2.0
          Properties:
            BorderThickness: =0
            Color: =Color.White
            Fill: =RGBA(4, 62, 128, 1)
            FontWeight: =FontWeight.Semibold
            Height: =42
            HoverFill: =ColorFade(Self.Fill, -12%)
            OnSelect: =Navigate(scrProjects)
            RadiusBottomLeft: =4
            RadiusBottomRight: =4
            RadiusTopLeft: =4
            RadiusTopRight: =4
            Size: =14
            Text: ="Back"
            Width: =92
            X: =20
            Y: =23
      - rectHdrDivider1:
          Control: Rectangle@2.3.0
          Properties:
            Fill: =RGBA(255, 255, 255, 0.45)
            Height: =48
            Width: =1
            X: =130
            Y: =20
      - lblHdrProjectId:
          Control: Label@2.5.1
          Properties:
            Color: =Color.White
            Height: =26
            Size: =13
            Text: =varProject.Title
            Width: =140
            X: =142
            Y: =12
      - lblHdrCustomerCap:
          Control: Label@2.5.1
          Properties:
            Color: =RGBA(214, 230, 248, 1)
            Height: =20
            Size: =9
            Text: ="CUSTOMER"
            Width: =200
            X: =290
            Y: =10
      - lblHdrCustomer:
          Control: Label@2.5.1
          Properties:
            Color: =Color.White
            FontWeight: =FontWeight.Semibold
            Height: =32
            Size: =19
            Text: =varProject.Customer
            Width: =250
            X: =290
            Y: =28
      - lblHdrQE:
          Control: Label@2.5.1
          Properties:
            Color: =RGBA(214, 230, 248, 1)
            Height: =24
            Size: =11
            Text: |-
              ="QE: " & Coalesce(varProject.QE.DisplayName, "Unassigned") & " · " & varProject.ProjectType.Value
            Width: =400
            X: =142
            Y: =60
      - rectHdrDivider2:
          Control: Rectangle@2.3.0
          Properties:
            Fill: =RGBA(255, 255, 255, 0.45)
            Height: =40
            Width: =1
            X: =552
            Y: =18
      - lblHdrPartCap:
          Control: Label@2.5.1
          Properties:
            Color: =RGBA(214, 230, 248, 1)
            Height: =20
            Size: =9
            Text: ="PART NUMBER"
            Width: =200
            X: =566
            Y: =10
      - lblHdrPart:
          Control: Label@2.5.1
          Properties:
            Color: =Color.White
            FontWeight: =FontWeight.Semibold
            Height: =32
            Size: =19
            Text: =varProject.PartNumber
            Width: =200
            X: =566
            Y: =28
      - rectHdrDivider3:
          Control: Rectangle@2.3.0
          Properties:
            Fill: =RGBA(255, 255, 255, 0.45)
            Height: =40
            Width: =1
            X: =778
            Y: =18
      - lblHdrRevCap:
          Control: Label@2.5.1
          Properties:
            Color: =RGBA(214, 230, 248, 1)
            Height: =20
            Size: =9
            Text: ="REVISION"
            Width: =120
            X: =792
            Y: =10
      - lblHdrRev:
          Control: Label@2.5.1
          Properties:
            Color: =Color.White
            FontWeight: =FontWeight.Semibold
            Height: =32
            Size: =19
            Text: =varProject.Revision
            Width: =120
            X: =792
            Y: =28
      - btnOpenFolder:
          Control: Classic/Button@2.2.0
          Properties:
            BorderColor: =RGBA(255, 255, 255, 0.6)
            BorderThickness: =1
            Color: =Color.White
            DisplayMode: =If(IsBlank(varProject.ProjectFolderUrl), DisplayMode.Disabled, DisplayMode.Edit)
            Fill: =RGBA(10, 92, 178, 1)
            Height: =42
            HoverFill: =ColorFade(Self.Fill, -12%)
            OnSelect: =Launch(varProject.ProjectFolderUrl)
            RadiusBottomLeft: =4
            RadiusBottomRight: =4
            RadiusTopLeft: =4
            RadiusTopRight: =4
            Size: =13
            Text: ="Project folder"
            Width: =140
            X: =Parent.Width - 280
            Y: =23
      - btnRefreshDetail:
          Control: Classic/Button@2.2.0
          Properties:
            BorderThickness: =0
            Color: =Color.White
            Fill: =RGBA(4, 62, 128, 1)
            FontWeight: =FontWeight.Semibold
            Height: =42
            HoverFill: =ColorFade(Self.Fill, -12%)
            OnSelect: |-
              =With(
                  {rowId: varRow.ID, projId: varProject.ID},
                  Refresh('NPI Projects');
                  Refresh('Project Requirements');
                  ClearCollect(colProjects, 'NPI Projects');
                  Set(varProject, LookUp(colProjects, ID = projId));
                  Set(varCurrentGate, Max(1, Min(4, Coalesce(varProject.CurrentGate, 1))));
                  ClearCollect(colReqs, Filter('Project Requirements', ProjectID = varProject.Title));
                  Set(varRow, LookUp(colReqs, ID = rowId));
                  __SET_CANREVIEW__
              )
            RadiusBottomLeft: =4
            RadiusBottomRight: =4
            RadiusTopLeft: =4
            RadiusTopRight: =4
            Size: =14
            Text: ="Refresh"
            Width: =112
            X: =Parent.Width - 130
            Y: =23
      - galGates:
          Control: Gallery@2.15.0
          Variant: Horizontal
          Properties:
            Height: =68
            Items: =Sequence(4)
            OnSelect: |-
              =Set(varGate, ThisItem.Value);
              If(varDocFilter = "Open", Set(varDocFilter, "Needed"))
            ShowScrollbar: =false
            TemplatePadding: =0
            TemplateSize: =(Parent.Width - 48) / 4
            Width: =Parent.Width - 48
            X: =24
            Y: =96
          Children:
            - rectGateBg:
                Control: Rectangle@2.3.0
                Properties:
                  Fill: =If(ThisItem.Value = varGate, RGBA(228, 238, 250, 1), RGBA(0, 0, 0, 0))
                  Height: =68
                  OnSelect: =Select(Parent)
                  Width: =Parent.TemplateWidth - 12
                  X: =0
                  Y: =0
            - lblGateName:
                Control: Label@2.5.1
                Properties:
                  Color: =RGBA(17, 24, 39, 1)
                  FontWeight: =FontWeight.Semibold
                  Height: =26
                  OnSelect: =Select(Parent)
                  Size: =13
                  Text: ="Gate " & ThisItem.Value
                  Width: =80
                  X: =8
                  Y: =4
            - lblGatePct:
                Control: Label@2.5.1
                Properties:
                  Color: =RGBA(17, 24, 39, 1)
                  FontWeight: =FontWeight.Semibold
                  Height: =26
                  OnSelect: =Select(Parent)
                  Size: =13
                  Text: |-
                    =With(
                        {r: Filter(colReqs, Gate = ThisItem.Value)},
                        If(
                            CountRows(r) = 0,
                            "0%",
                            Text(CountRows(Filter(r, Status.Value in ["Reviewed", "N/A"])) / CountRows(r), "0%")
                        )
                    )
                  Width: =80
                  X: =96
                  Y: =4
            - rectGateTrack:
                Control: Rectangle@2.3.0
                Properties:
                  Fill: =RGBA(218, 224, 233, 1)
                  Height: =8
                  OnSelect: =Select(Parent)
                  Width: =Parent.TemplateWidth - 48
                  X: =12
                  Y: =34
            - rectGateFill:
                Control: Rectangle@2.3.0
                Properties:
                  Fill: =If(ThisItem.Value < varCurrentGate, RGBA(16, 124, 16, 1), RGBA(10, 92, 178, 1))
                  Height: =8
                  OnSelect: =Select(Parent)
                  Visible: =Self.Width > 0
                  Width: |-
                    =With(
                        {r: Filter(colReqs, Gate = ThisItem.Value)},
                        If(
                            CountRows(r) = 0,
                            0,
                            (Parent.TemplateWidth - 48) * CountRows(Filter(r, Status.Value in ["Reviewed", "N/A"])) / CountRows(r)
                        )
                    )
                  X: =12
                  Y: =34
            - lblGateState:
                Control: Label@2.5.1
                Properties:
                  Color: =RGBA(75, 85, 99, 1)
                  Height: =24
                  OnSelect: =Select(Parent)
                  Size: =11
                  Text: |-
                    =With(
                        {r: Filter(colReqs, Gate = ThisItem.Value)},
                        If(
                            varProject.ProjectStatus.Value = "Closed" || ThisItem.Value < varCurrentGate,
                            "Signed",
                            ThisItem.Value = varCurrentGate,
                            "Current · Not signed",
                            CountRows(Filter(r, Status.Value <> "Not started")) > 0,
                            "Started early",
                            "Not started"
                        )
                    )
                  Width: =Parent.TemplateWidth - 40
                  X: =8
                  Y: =44
      - lblDocuments:
          Control: Label@2.5.1
          Properties:
            Color: =RGBA(17, 24, 39, 1)
            FontWeight: =FontWeight.Bold
            Height: =38
            Size: =19
            Text: ="Documents"
            Width: =300
            X: =24
            Y: =172
      - btnDocAll:
          Control: Classic/Button@2.2.0
          Properties:
            BorderThickness: =0
            Color: =If(varDocFilter = "All", Color.White, RGBA(17, 24, 39, 1))
            Fill: =If(varDocFilter = "All", RGBA(10, 92, 178, 1), RGBA(226, 231, 238, 1))
            FontWeight: =FontWeight.Semibold
            Height: =36
            OnSelect: =Set(varDocFilter, "All")
            RadiusBottomLeft: =4
            RadiusBottomRight: =4
            RadiusTopLeft: =4
            RadiusTopRight: =4
            Size: =13
            Text: ="All"
            Width: =88
            X: =24
            Y: =212
      - btnDocOpen:
          Control: Classic/Button@2.2.0
          Properties:
            BorderThickness: =0
            Color: =If(varDocFilter = "Open", Color.White, RGBA(17, 24, 39, 1))
            Fill: =If(varDocFilter = "Open", RGBA(10, 92, 178, 1), RGBA(226, 231, 238, 1))
            FontWeight: =FontWeight.Semibold
            Height: =36
            OnSelect: =Set(varDocFilter, "Open")
            RadiusBottomLeft: =4
            RadiusBottomRight: =4
            RadiusTopLeft: =4
            RadiusTopRight: =4
            Size: =13
            Text: ="Open"
            Width: =88
            X: =120
            Y: =212
      - btnDocNeeded:
          Control: Classic/Button@2.2.0
          Properties:
            BorderThickness: =0
            Color: =If(varDocFilter = "Needed", Color.White, RGBA(17, 24, 39, 1))
            Fill: =If(varDocFilter = "Needed", RGBA(10, 92, 178, 1), RGBA(226, 231, 238, 1))
            FontWeight: =FontWeight.Semibold
            Height: =36
            OnSelect: =Set(varDocFilter, "Needed")
            RadiusBottomLeft: =4
            RadiusBottomRight: =4
            RadiusTopLeft: =4
            RadiusTopRight: =4
            Size: =13
            Text: =If(varGate = varCurrentGate, "Needed for current gate", "Needed for Gate " & varGate)
            Width: =230
            X: =216
            Y: =212
      - lblRemaining:
          Control: Label@2.5.1
          Properties:
            Color: =RGBA(31, 41, 55, 1)
            Height: =26
            Size: =12
            Text: |-
              =If(
                  varDocFilter = "Open",
                  "All gates · " & CountRows(Filter(colReqs, !(Status.Value in ["Reviewed", "N/A"]))) & " items open",
                  With(
                      {n: CountRows(Filter(colReqs, Gate = varGate && !(Status.Value in ["Reviewed", "N/A"])))},
                      "Gate " & varGate & " · " & n & If(n = 1, " item remaining", " items remaining")
                  )
              )
            Width: =500
            X: =24
            Y: =250
      - lblDocsEmpty:
          Control: Label@2.5.1
          Properties:
            Color: =RGBA(75, 85, 99, 1)
            Height: =40
            Size: =12
            Text: =If(varDocFilter = "All", "No requirements for this gate.", "Nothing left to do in this view.")
            Visible: =CountRows(galDocs.AllItems) = 0
            Width: =500
            X: =24
            Y: =284
      - galDocs:
          Control: Gallery@2.15.0
          Variant: Vertical
          Properties:
            Height: =Parent.Height - 278 - 88
            Items: |-
              =Switch(
                  varDocFilter,
                  "All",
                  SortByColumns(Filter(colReqs, Gate = varGate), "SortOrder", SortOrder.Ascending),
                  "Open",
                  SortByColumns(Filter(colReqs, !(Status.Value in ["Reviewed", "N/A"])), "Gate", SortOrder.Ascending, "SortOrder", SortOrder.Ascending),
                  SortByColumns(Filter(colReqs, Gate = varGate && !(Status.Value in ["Reviewed", "N/A"])), "SortOrder", SortOrder.Ascending)
              )
            OnSelect: |-
              =Set(varRow, ThisItem);
              __SET_CANREVIEW__;
              Reset(txtNote)
            TemplatePadding: =0
            TemplateSize: =76
            Width: =Parent.Width - 568
            X: =24
            Y: =278
          Children:
            - rectDocRow:
                Control: Rectangle@2.3.0
                Properties:
                  BorderColor: =RGBA(209, 217, 228, 1)
                  BorderThickness: =1
                  Fill: =If(ThisItem.ID = varRow.ID, RGBA(232, 242, 253, 1), Color.White)
                  Height: =68
                  OnSelect: =Select(Parent)
                  Width: =Parent.TemplateWidth - 4
                  X: =0
                  Y: =0
            - rectDocAccent:
                Control: Rectangle@2.3.0
                Properties:
                  Fill: =RGBA(10, 92, 178, 1)
                  Height: =68
                  OnSelect: =Select(Parent)
                  Visible: =ThisItem.ID = varRow.ID
                  Width: =4
                  X: =0
                  Y: =0
            - lblDocTitle:
                Control: Label@2.5.1
                Properties:
                  Color: =RGBA(17, 24, 39, 1)
                  FontWeight: =FontWeight.Semibold
                  Height: =30
                  OnSelect: =Select(Parent)
                  Size: =14
                  Text: |-
                    =ThisItem.Form & If(!IsBlank(ThisItem.Section), " " & ThisItem.Section) & " — " &
                    Switch(
                        ThisItem.RequirementType.Value,
                        "Signed (entire doc)", "Signed document",
                        "If required (N/A + reason)", "If required",
                        ThisItem.RequirementType.Value
                    )
                  Width: =Parent.TemplateWidth - 170
                  X: =14
                  Y: =6
            - lblDocAssignee:
                Control: Label@2.5.1
                Properties:
                  Color: =RGBA(55, 65, 81, 1)
                  Height: =26
                  OnSelect: =Select(Parent)
                  Size: =12
                  Text: |-
                    =If(varDocFilter = "Open", "Gate " & ThisItem.Gate & " · ", "") & Coalesce(ThisItem.Assignee.DisplayName, "Unassigned")
                  Width: =260
                  X: =14
                  Y: =36
            - lblDocDue:
                Control: Label@2.5.1
                Properties:
                  Color: |-
                    =If(
                        !IsBlank(ThisItem.DueDate) && ThisItem.DueDate < Today() && !(ThisItem.Status.Value in ["Reviewed", "N/A"]),
                        RGBA(177, 14, 30, 1),
                        RGBA(55, 65, 81, 1)
                    )
                  Height: =26
                  OnSelect: =Select(Parent)
                  Size: =12
                  Text: |-
                    =If(
                        IsBlank(ThisItem.DueDate),
                        "No due date",
                        "Due " & Text(ThisItem.DueDate, "mmm d") &
                        If(ThisItem.DueDate < Today() && !(ThisItem.Status.Value in ["Reviewed", "N/A"]), " · Overdue", "")
                    )
                  Width: =220
                  X: =280
                  Y: =36
            - lblDocStatus:
                Control: Label@2.5.1
                Properties:
                  Align: =Align.Right
                  Color: |-
                    =Switch(
                        ThisItem.Status.Value,
                        "Reviewed", RGBA(16, 124, 16, 1),
                        "N/A", RGBA(107, 114, 128, 1),
                        "Done", RGBA(160, 90, 0, 1),
                        RGBA(10, 92, 178, 1)
                    )
                  FontWeight: =FontWeight.Semibold
                  Height: =30
                  OnSelect: =Select(Parent)
                  Size: =13
                  Text: =If(ThisItem.Status.Value = "Done", "Ready for review", ThisItem.Status.Value)
                  Width: =150
                  X: =Parent.TemplateWidth - 170
                  Y: =8
      - lblHiddenNote:
          Control: Label@2.5.1
          Properties:
            Color: =RGBA(55, 65, 81, 1)
            Height: =26
            Size: =12
            Text: ="Reviewed and N/A items are hidden in this view."
            Visible: =varDocFilter <> "All"
            Width: =500
            X: =24
            Y: =Parent.Height - 86
      - btnSignGate:
          Control: Classic/Button@2.2.0
          Properties:
            BorderThickness: =0
            Color: =Color.White
            DisabledColor: =RGBA(107, 114, 128, 1)
            DisabledFill: =RGBA(226, 231, 238, 1)
            DisplayMode: =DisplayMode.Disabled
            Fill: =RGBA(16, 124, 16, 1)
            FontWeight: =FontWeight.Semibold
            Height: =38
            RadiusBottomLeft: =4
            RadiusBottomRight: =4
            RadiusTopLeft: =4
            RadiusTopRight: =4
            Size: =13
            Text: ="Sign Gate " & varCurrentGate
            Width: =150
            X: =24
            Y: =Parent.Height - 52
      - lblSignGateHint:
          Control: Label@2.5.1
          Properties:
            Color: =RGBA(55, 65, 81, 1)
            Height: =38
            Size: =12
            Text: |-
              =If(
                  varProject.ProjectStatus.Value = "Closed",
                  "Project is closed.",
                  With(
                      {r: Filter(colReqs, Gate = varCurrentGate)},
                      If(
                          CountRows(r) > 0 &&
                          CountRows(Filter(r, !(Status.Value in ["Reviewed", "N/A"]))) = 0 &&
                          CountRows(Filter(r, IsGateDoc && IsBlank(FileLink))) = 0,
                          "Gate " & varCurrentGate & " requirements are met. Gate sign-off is added in Increment 4.",
                          "Available when gate requirements are met"
                      )
                  )
              )
            Width: =Parent.Width - 568 - 170
            X: =190
            Y: =Parent.Height - 52
      - rectPanel:
          Control: Rectangle@2.3.0
          Properties:
            BorderColor: =RGBA(209, 217, 228, 1)
            BorderThickness: =1
            Fill: =Color.White
            Height: =Parent.Height - 188
            Width: =496
            X: =Parent.Width - 520
            Y: =172
      - lblPanelEmpty:
          Control: Label@2.5.1
          Properties:
            Color: =RGBA(75, 85, 99, 1)
            Height: =80
            Size: =12
            Text: ="Select a document on the left to see its details, add a note, submit it for review or review it."
            Visible: =IsBlank(varRow)
            Width: =456
            X: =Parent.Width - 500
            Y: =190
      - lblRowTitle:
          Control: Label@2.5.1
          Properties:
            Color: =RGBA(17, 24, 39, 1)
            FontWeight: =FontWeight.Bold
            Height: =36
            Size: =17
            Text: |-
              =varRow.Form & If(!IsBlank(varRow.Section), " · " & Substitute(varRow.Section, "Sec ", "Section "))
            Visible: =!IsBlank(varRow)
            Width: =340
            X: =Parent.Width - 500
            Y: =184
      - lblRowPill:
          Control: Label@2.5.1
          Properties:
            Align: =Align.Center
            Color: |-
              =Switch(
                  varRow.Status.Value,
                  "Reviewed", RGBA(16, 124, 16, 1),
                  "N/A", RGBA(75, 85, 99, 1),
                  "Done", RGBA(140, 78, 0, 1),
                  RGBA(10, 92, 178, 1)
              )
            Fill: |-
              =Switch(
                  varRow.Status.Value,
                  "Reviewed", RGBA(223, 246, 221, 1),
                  "N/A", RGBA(237, 239, 242, 1),
                  "Done", RGBA(255, 241, 214, 1),
                  RGBA(224, 237, 252, 1)
              )
            FontWeight: =FontWeight.Semibold
            Height: =28
            Size: =12
            Text: =If(varRow.Status.Value = "Done", "Ready for review", varRow.Status.Value)
            Visible: =!IsBlank(varRow)
            Width: =130
            X: =Parent.Width - 168
            Y: =188
      - lblRowHelp:
          Control: Label@2.5.1
          Properties:
            Color: =RGBA(55, 65, 81, 1)
            Height: =28
            Size: =12
            Text: |-
              =Switch(
                  varRow.Status.Value,
                  "Done", "Submitted. Waiting for review by the project QE or the QM.",
                  "Reviewed", "Reviewed by " & Coalesce(varRow.ReviewedBy.DisplayName, "unknown") & If(IsBlank(varRow.ReviewedDate), "", " on " & Text(varRow.ReviewedDate, "mmm d, yyyy")) & ".",
                  "N/A", "Not applicable: " & Coalesce(varRow.NAReason, "no reason recorded"),
                  Switch(
                      varRow.RequirementType.Value,
                      "Section complete", "Complete this section and submit for review.",
                      "Signed (entire doc)", "Upload the fully signed document and submit for review.",
                      "Draft uploaded", "Upload the started draft and submit for review.",
                      "Sent to customer", "Upload the copy sent to the customer and submit for review.",
                      "Customer signed", "Upload the customer-signed copy and submit for review.",
                      "If required (N/A + reason)", "Upload it if required. The QE can mark it N/A with a reason.",
                      "Complete the work and submit for review."
                  )
              )
            Visible: =!IsBlank(varRow)
            Width: =456
            X: =Parent.Width - 500
            Y: =222
      - lblAssignedCap:
          Control: Label@2.5.1
          Properties:
            Color: =RGBA(17, 24, 39, 1)
            FontWeight: =FontWeight.Semibold
            Height: =28
            Size: =12
            Text: ="Assigned to"
            Visible: =!IsBlank(varRow)
            Width: =100
            X: =Parent.Width - 500
            Y: =252
      - lblAssignedVal:
          Control: Label@2.5.1
          Properties:
            Color: =RGBA(31, 41, 55, 1)
            Height: =28
            Size: =12
            Text: =Coalesce(varRow.Assignee.DisplayName, "Unassigned")
            Visible: =!IsBlank(varRow)
            Width: =190
            X: =Parent.Width - 400
            Y: =252
      - lblDueCap:
          Control: Label@2.5.1
          Properties:
            Color: =RGBA(17, 24, 39, 1)
            FontWeight: =FontWeight.Semibold
            Height: =28
            Size: =12
            Text: ="Due"
            Visible: =!IsBlank(varRow)
            Width: =46
            X: =Parent.Width - 204
            Y: =252
      - lblDueVal:
          Control: Label@2.5.1
          Properties:
            Color: |-
              =If(
                  !IsBlank(varRow.DueDate) && varRow.DueDate < Today() && !(varRow.Status.Value in ["Reviewed", "N/A"]),
                  RGBA(177, 14, 30, 1),
                  RGBA(31, 41, 55, 1)
              )
            Height: =28
            Size: =12
            Text: =If(IsBlank(varRow.DueDate), "Not set", Text(varRow.DueDate, "mmm d, yyyy"))
